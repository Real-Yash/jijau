name: Build Jijau Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release signing key
        env:
          JIJAU_KEYSTORE_BASE64: ${{ secrets.JIJAU_KEYSTORE_BASE64 }}
        run: |
          test -n "$JIJAU_KEYSTORE_BASE64"
          printf '%s' "$JIJAU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jijau-release.jks"
          chmod 600 "$RUNNER_TEMP/jijau-release.jks"

      - name: Build signed release APK
        env:
          JIJAU_STORE_FILE: ${{ runner.temp }}/jijau-release.jks
          JIJAU_STORE_PASSWORD: ${{ secrets.JIJAU_KEYSTORE_PASSWORD }}
          JIJAU_KEY_ALIAS: ${{ secrets.JIJAU_KEY_ALIAS }}
          JIJAU_KEY_PASSWORD: ${{ secrets.JIJAU_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify release signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Stage installable APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/Jijau-UdyamSuite.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jijau-UdyamSuite-APK
          path: artifact/Jijau-UdyamSuite.apk
          if-no-files-found: error
